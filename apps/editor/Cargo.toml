[package]
name = "vellum-editor"
description = "The Vellum editor: page builder and vector canvas, compiled to WebAssembly."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vellum-schema.workspace = true
vellum-core.workspace = true
vellum-vector.workspace = true
serde.workspace = true
serde_json.workspace = true
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "Blob",
  "BlobPropertyBag",
  "DataTransfer",
  "DomRect",
  "DragEvent",
  "Element",
  "File",
  "FileList",
  "Headers",
  "HtmlAnchorElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "HtmlTextAreaElement",
  "KeyboardEvent",
  "PointerEvent",
  "Request",
  "RequestInit",
  "Response",
  "Storage",
  "Url",
  "Window",
]
