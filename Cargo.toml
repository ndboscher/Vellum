[workspace]
resolver = "2"
members = ["crates/schema", "crates/vector", "crates/core", "crates/cli", "apps/editor", "apps/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
vellum-schema = { path = "crates/schema" }
vellum-vector = { path = "crates/vector" }
vellum-core = { path = "crates/core" }
vellum-server = { path = "apps/server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release.package.vellum-editor]
opt-level = "z"
