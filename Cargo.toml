[workspace]
resolver = "2"
members = [
    "crates/schema",
    "crates/vector",
    "crates/core",
    "crates/export-core",
    "crates/export-html",
    "crates/export-react",
    "crates/cli",
    "apps/editor",
    "apps/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
vellum-schema = { path = "crates/schema" }
vellum-vector = { path = "crates/vector" }
vellum-core = { path = "crates/core" }
vellum-export-core = { path = "crates/export-core" }
vellum-export-html = { path = "crates/export-html" }
vellum-export-react = { path = "crates/export-react" }
vellum-server = { path = "apps/server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
insta = "1"

[profile.release.package.vellum-editor]
opt-level = "z"
