[package]
name = "vellum-cli"
description = "The `vellum` command: dev server and (later) export."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vellum"
path = "src/main.rs"

[dependencies]
vellum-server.workspace = true
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
